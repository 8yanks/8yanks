name: Galaga contributions

on:
  schedule:
    - cron: '25 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/galaga.yml']

permissions:
  contents: write

concurrency:
  group: contribution-galaga
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          games: galaga
          hide_month_labels: 'false'
      - name: Publish generated SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.svg'
          git commit -m 'Update Galaga contribution animation'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:output
